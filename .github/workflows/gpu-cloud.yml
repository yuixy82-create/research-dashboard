name: GPU cloud tracker (daily)

on:
  schedule:
    - cron: "30 22 * * *"   # 07:30 KST — 아침 갱신
    - cron: "0 13 * * *"    # 22:00 KST — 미국 전일 금리 반영분 갱신
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # 수집·커밋은 Pages 배포 대기열과 분리한다.
  # 같은 저장소의 다른 트래커가 Pages를 점유해도 데이터는 먼저 들어간다.
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: gpu-cloud-collect
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: collect and build
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python gpu-cloud/tracker.py

      - name: commit changes
        run: |
          git config user.name "tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gpu-cloud/cache.json gpu-cloud/index.html
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
            exit 0
          fi
          git commit -m "gpu-cloud: daily update"
          # 다른 봇(cnsy·palm-oil·refining)이 같은 저장소에 동시에 커밋하면
          # push가 'fetch first'로 거부된다 — rebase 후 재시도
          for i in 1 2 3 4 5; do
            if git push; then
              echo "push 성공 (시도 $i)"
              exit 0
            fi
            echo "push 거부 — 원격 반영 후 재시도 ($i/5)"
            sleep $((i * 5))
            git pull --rebase --autostash origin main || exit 1
          done
          echo "ERROR: 5회 재시도 후에도 push 실패"
          exit 1

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v5
