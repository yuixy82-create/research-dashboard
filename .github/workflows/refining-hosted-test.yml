name: refining-hosted-test

# 임시: refining 수집이 깃허브 러너(ubuntu-latest)에서도 되는지 확인. 커밋·배포 없음. 확인 뒤 삭제
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch futures
        run: python refining/scripts/fetch_futures.py || echo "::warning::FAILED futures"
      - name: Fetch EIA
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python refining/scripts/fetch_eia.py || echo "::warning::FAILED eia"
      - name: Fetch customs
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY || secrets.DATA_GO_KR_KE }}
        run: python refining/scripts/fetch_customs.py || echo "::warning::FAILED customs"
      - name: Fetch lube
        run: python refining/scripts/fetch_lube.py || echo "::warning::FAILED lube"
      - name: Show result (no commit)
        run: |
          git status --short refining/data | head -40
          git diff --stat | tail -5
          python refining/scripts/ci_report.py || true
