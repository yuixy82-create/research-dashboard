name: cnsy-tracker update

on:
  schedule:
    # UTC 기준. 21:00 UTC = 06:00 KST (미국장 마감 후), 12:00 UTC = 21:00 KST (미국장 개장 전)
    - cron: "0 21 * * *"
    - cron: "0 12 * * *"
  workflow_dispatch:
  push:
    paths:
      - "cnsy-tracker/scripts/**"
      - ".github/workflows/cnsy-update.yml"

permissions:
  contents: write

concurrency:
  group: cnsy-tracker
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 수집
        run: python3 cnsy-tracker/scripts/fetch_all.py

      - name: 변화가 있을 때만 커밋
        run: |
          git config user.name  "cnsy-bot"
          git config user.email "actions@github.com"
          if [ -z "$(git status --porcelain cnsy-tracker/data)" ]; then
            echo "변화 없음"; exit 0
          fi
          git add cnsy-tracker/data
          git commit -m "cnsy: data $(date -u +%Y-%m-%d\ %H:%M)Z"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "push 재시도 $i"; sleep 5
          done
          echo "push 실패"; exit 1
