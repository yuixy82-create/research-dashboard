name: palm-oil update

on:
  schedule:
    - cron: '30 22 * * 0-4'   # 07:30 KST (월~금)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch prices
        run: python3 palm-oil/scripts/fetch.py

      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain palm-oil/data)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add palm-oil/data
            git commit -m "palm-oil: 가격 데이터 갱신 $(date -u +%Y-%m-%d)"
            git push
          else
            echo "no change"
          fi
