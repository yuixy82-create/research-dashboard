name: refining-update

on:
  schedule:
    - cron: "30 22 * * *"   # 07:30 KST = 18:30 ET — 전일 정산(14:30 ET) 끝난 뒤. 확정치
    - cron: "0 13 * * *"    # 22:00 KST = 09:00 ET — 장중. 잠정치로 먼저 붙임
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  fetch:
    # 형 메인컴(DESKTOP-THUP7M4)에서 실행. 깃허브 러너 IP는 야후가 429로 막음(26.09.02 실측)
    runs-on: self-hosted
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 선물 — 매 영업일. 크랙 2종. 장중이면 잠정치, 정산 뒤 실행에서 확정치로 덮임
      - name: Fetch futures
        run: python refining/scripts/fetch_futures.py
        continue-on-error: true

      # EIA — 주간 재고만
      - name: Fetch EIA
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python refining/scripts/fetch_eia.py
        continue-on-error: true

      # 윈도우 러너라 bash 대신 파이썬 스크립트로 처리
      - name: Discard timestamp-only changes
        run: python refining/scripts/ci_guard.py

      - name: Commit if changed
        run: python refining/scripts/ci_commit.py

      # GITHUB_TOKEN 커밋은 다른 워크플로를 깨우지 않으므로 여기서 직접 배포
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Report status
        run: python refining/scripts/ci_report.py
