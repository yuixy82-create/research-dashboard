name: refining-update

on:
  schedule:
    - cron: "30 22 * * *"   # 07:30 KST = 18:30 ET — 전일 정산(14:30 ET) 끝난 뒤. 확정치
    - cron: "0 13 * * *"    # 22:00 KST = 09:00 ET — 장중. 잠정치로 먼저 붙임
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # 깃허브 러너에서 실행 (26.11.19 전환). 야후 선물·EIA·관세청은 깃허브 러너에서도 정상 수집됨(같은 날 실측).
  # Group III 기유(fetch_lube.py)만 깃허브 러너에서 막혀서 refining-lube.yml(형 메인컴)로 분리함.
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: refining-collect
      cancel-in-progress: false
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 선물 — 매 영업일. 크랙 2종. 장중이면 잠정치, 정산 뒤 실행에서 확정치로 덮임
      - name: Fetch futures
        run: python refining/scripts/fetch_futures.py
        continue-on-error: true

      # EIA — 주간 재고만
      - name: Fetch EIA
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python refining/scripts/fetch_eia.py
        continue-on-error: true

      # 관세청 — 월간. PX 수출단가 − 나프타 수입단가. 매 실행 재계산(호출 2건)
      - name: Fetch customs
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY || secrets.DATA_GO_KR_KE }}
        run: python refining/scripts/fetch_customs.py
        continue-on-error: true

      # GitHub API로 커밋(값이 바뀐 파일만). 최신 HEAD 위에 올리므로 다른 봇과 겹쳐도 안전
      - name: Commit if changed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python refining/scripts/ci_commit.py

      - name: Report status
        run: python refining/scripts/ci_report.py
        continue-on-error: true

  # GITHUB_TOKEN 커밋은 다른 워크플로를 깨우지 않으므로 같은 워크플로 안에서 이어서 배포한다
  deploy:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main            # collect 잡이 방금 올린 커밋을 받도록
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      # 방금 올린 배포 묶음이 아직 조회되지 않아 실패하는 경우(26.11.26 실측) 30초 뒤 한 번 더 시도
      - name: Wait before retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - name: Retry deploy
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
