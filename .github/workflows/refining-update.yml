name: refining-update

on:
  schedule:
    - cron: "30 22 * * *"   # 07:30 KST — 전일 미국 종가 반영분
    - cron: "0 13 * * *"    # 22:00 KST — 미국 장중 반영분
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refining-update
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch EIA
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python3 refining/scripts/fetch_eia.py
        continue-on-error: true

      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain refining/data)" ]; then
            git config user.name  "tracker-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add refining/data
            git commit -m "refining: daily update"
            git push
          else
            echo "변경 없음"
          fi

      - name: Report status
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          p = pathlib.Path("refining/data/auto.json")
          d = json.loads(p.read_text(encoding="utf-8"))
          print("status:", d.get("status"))
          for k, v in (d.get("indicators") or {}).items():
              print(f"  {k}: {v.get('value')} {v.get('unit')} ({v.get('asOf')})")
          for e in (d.get("errors") or []):
              print("  ERR", e)
          sys.exit(0 if d.get("status") == "ok" else 1)
          PY
