name: refining-lube-diag
# 임시 진단. 출력만 하고 커밋·배포 없음. 확인 뒤 삭제
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  diag:
    runs-on: self-hosted
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      PY: C:\Users\user\AppData\Local\Programs\Python\Python312\python.exe
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose
        run: "& $env:PY refining/scripts/_diag_lube.py"
